<!--
  SCREEN: Update Inventory Quantity modal
  Reached from: Inventory tab -> row kebab -> "Update Received Quantity" or "Update Dispensed Quantity"
  Maps to TWO separate endpoints:
    PUT /pharmaTrack/supplyColdManagement/updateReceivedQuantity/{id}
    PUT /pharmaTrack/supplyColdManagement/updateDispensedQuantity/{id}
  Built as ONE modal with a toggle rather than two nearly-identical modals, per earlier discussion.
  Flag if you'd rather have these as two fully separate modals instead.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmaTrack — Update Inventory Quantity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-active:#1a7a4f; --card-border:#e3e2dd;
    --text-primary:#1a1d1a; --text-secondary:#6b6b62; --text-muted:#9a998d;
    --radius-md:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:rgba(20,30,25,.35);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;width:480px;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.22);padding:28px 32px;}
  .modal h2{font-size:19px;font-weight:800;margin-bottom:6px;}
  .modal .sub{font-size:13px;color:var(--text-secondary);margin-bottom:20px;}

  .toggle{display:flex;background:#f5f4ef;border-radius:10px;padding:4px;margin-bottom:22px;}
  .toggle-opt{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--text-secondary);}
  .toggle-opt.active{background:#fff;color:var(--text-primary);box-shadow:0 2px 6px rgba(20,30,25,.08);}

  .current{display:flex;justify-content:space-between;align-items:center;background:#f5f4ef;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px;}
  .current .label{font-size:12px;color:var(--text-muted);}
  .current .val{font-size:16px;font-weight:800;}

  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .field input{width:100%;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--card-border);font-size:13.5px;color:var(--text-primary);font-family:inherit;background:#fff;}

  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .btn{padding:10px 20px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.cancel{background:#fff;border:1px solid var(--card-border);color:var(--text-primary);}
  .btn.save{background:var(--sidebar-active);border:none;color:#fff;}
</style>
</head>
<body>

<div class="modal">
  <h2>Update Inventory Quantity</h2>
  <div class="sub">Site 1 · BATCH0912</div>

  <div class="toggle">
    <div class="toggle-opt active" onclick="showMode('received', this)">Received Quantity</div>
    <div class="toggle-opt" onclick="showMode('dispensed', this)">Dispensed Quantity</div>
  </div>

  <div class="current">
    <div><div class="label" id="currentLabel">Current Quantity Received</div><div class="val" id="currentVal">400.00</div></div>
  </div>

  <div class="field">
    <label id="fieldLabel">New Quantity Received</label>
    <input type="text" id="fieldInput" placeholder="e.g. 450.00">
  </div>

  <div class="modal-foot">
    <button class="btn cancel">Cancel</button>
    <button class="btn save">Save</button>
  </div>
</div>

<script>
  const data = {
    received: { current: '400.00', currentLabel: 'Current Quantity Received', fieldLabel: 'New Quantity Received', placeholder: 'e.g. 450.00' },
    dispensed: { current: '100.00', currentLabel: 'Current Quantity Dispensed', fieldLabel: 'New Quantity Dispensed', placeholder: 'e.g. 150.00' }
  };
  function showMode(mode, el){
    document.querySelectorAll('.toggle-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('currentLabel').textContent = data[mode].currentLabel;
    document.getElementById('currentVal').textContent = data[mode].current;
    document.getElementById('fieldLabel').textContent = data[mode].fieldLabel;
    document.getElementById('fieldInput').placeholder = data[mode].placeholder;
    document.getElementById('fieldInput').value = '';
  }
</script>

</body>
</html>
