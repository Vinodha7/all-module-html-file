<!--
  SCREEN: Shipment Tracker — Update Status
  Launched from: List row kebab menu -> "Update Status", or Detail page kebab menu -> "Update Status"
  ROLE: Supply Chain Manager / Pharma Admin ONLY
  Status enum: Dispatched / InTransit / Delivered / Lost / Rejected
  Reason field REQUIRED when Lost/Rejected (flags to Deviation module)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmaTrack — Update Shipment Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-active:#1d7a5f; --bg-page:#f5f4ef;
    --card-bg:#ffffff; --card-border:#e6e4db;
    --text-primary:#1a1d1a; --text-secondary:#6b6b62; --text-muted:#9a998d;
    --warn-bg:#fdf0da; --warn-text:#b3720a;
    --tooltip-bg:#1a1d1a; --tooltip-text:#fff;
    --radius-lg:16px; --radius-md:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:rgba(15,23,18,.45);min-height:100vh;display:flex;align-items:center;justify-content:center;}

  .tooltip{position:relative;}
  .tooltip::after{
    content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--tooltip-bg);color:var(--tooltip-text);font-size:11px;font-weight:500;padding:6px 10px;
    border-radius:6px;white-space:normal;width:210px;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:60;
  }
  .tooltip:hover::after{opacity:1;}

  .modal{background:var(--card-bg);width:480px;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{padding:22px 26px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h2{font-size:18px;font-weight:800;}
  .modal-head p{font-size:13px;color:var(--text-secondary);margin-top:3px;}
  .close{width:30px;height:30px;border-radius:8px;border:1px solid var(--card-border);background:#fff;cursor:pointer;color:var(--text-muted);transition:background .15s ease;}
  .close:hover{background:var(--bg-page);}
  .modal-body{padding:24px 26px;display:flex;flex-direction:column;gap:16px;}

  .current{display:flex;align-items:center;justify-content:space-between;background:var(--bg-page);border-radius:var(--radius-md);padding:12px 16px;}
  .current .label{font-size:12px;color:var(--text-muted);}
  .current .val{font-size:14px;font-weight:700;}
  .pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--warn-bg);color:var(--warn-text);}

  .field label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:8px;}
  .info-ic{width:15px;height:15px;border-radius:50%;background:var(--bg-page);border:1px solid var(--card-border);color:var(--text-muted);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:help;}
  .status-options{display:flex;flex-direction:column;gap:8px;}
  .option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--card-border);border-radius:var(--radius-md);cursor:pointer;font-size:14px;transition:border-color .15s ease,background .15s ease;}
  .option:hover{border-color:#c7c4b6;background:var(--bg-page);}
  .option.selected{border-color:var(--sidebar-active);background:#eef8f3;font-weight:700;}
  .option input{accent-color:var(--sidebar-active);}

  .field textarea, .field input{
    width:100%;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--card-border);
    font-size:14px;color:var(--text-primary);font-family:inherit;background:var(--bg-page);
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field textarea:focus,.field input:focus{outline:none;border-color:var(--sidebar-active);box-shadow:0 0 0 3px rgba(29,122,95,.12);}
  .required-note{font-size:11px;color:#c0392b;margin-top:6px;}

  .modal-foot{padding:20px 26px;border-top:1px solid var(--card-border);display:flex;justify-content:flex-end;gap:10px;}
  .btn{padding:11px 20px;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s ease,box-shadow .15s ease;}
  .btn.cancel{background:#fff;border:1px solid var(--card-border);color:var(--text-primary);}
  .btn.cancel:hover{background:var(--bg-page);}
  .btn.submit{background:var(--sidebar-active);border:none;color:#fff;}
  .btn.submit:hover{background:#186049;box-shadow:0 6px 16px rgba(29,122,95,.3);}
</style>
</head>
<body>

<div class="modal">
  <div class="modal-head">
    <div>
      <h2>Update Status — SHP-0044</h2>
      <p>BATCH0912 · Site 1 → Site 2</p>
    </div>
    <button class="close">✕</button>
  </div>

  <div class="modal-body">
    <div class="current">
      <div><div class="label">Current Status</div><div class="val">In Transit</div></div>
      <span class="pill">TRN</span>
    </div>

    <div class="field">
      <label>New Status</label>
      <div class="status-options">
        <label class="option"><input type="radio" name="status"> Dispatched</label>
        <label class="option selected"><input type="radio" name="status" checked> In Transit</label>
        <label class="option"><input type="radio" name="status"> Delivered</label>
        <label class="option"><input type="radio" name="status"> Lost</label>
        <label class="option"><input type="radio" name="status"> Rejected</label>
      </div>
    </div>

    <div class="field">
      <label>Status Date / Time</label>
      <input type="datetime-local">
    </div>

    <div class="field">
      <label>Reason / Notes <span class="info-ic tooltip" data-tooltip="Mandatory for Lost or Rejected — this creates a linked Deviation Record automatically">i</span></label>
      <textarea rows="3" placeholder="Required if marking as Lost or Rejected..."></textarea>
      <div class="required-note">⚠ Required when status is Lost or Rejected</div>
    </div>
  </div>

  <div class="modal-foot">
    <button class="btn cancel">Cancel</button>
    <button class="btn submit">Update Status</button>
  </div>
</div>

</body>
</html>
