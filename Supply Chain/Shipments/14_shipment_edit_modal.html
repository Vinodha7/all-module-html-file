<!--
  SCREEN: Edit Shipment modal
  Reached from: Shipments tab -> row kebab -> "Edit Shipment" (ONLY shown when Status = Dispatched)
  Fields prefilled with the existing DrugShipment record; same field set as Create Shipment
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmaTrack — Edit Shipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-active:#1a7a4f; --card-border:#e3e2dd;
    --text-primary:#1a1d1a; --text-secondary:#6b6b62; --text-muted:#9a998d;
    --info-bg:#f5f4ef; --radius-md:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:rgba(20,30,25,.35);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;width:600px;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.22);padding:28px 32px;}
  .modal h2{font-size:19px;font-weight:800;margin-bottom:6px;}
  .modal .sub{font-size:13px;color:var(--text-secondary);margin-bottom:18px;}
  .info-note{background:var(--info-bg);border-radius:var(--radius-md);padding:11px 15px;font-size:12.5px;color:var(--text-secondary);margin-bottom:20px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .req{color:#c0392b;}
  .field input{width:100%;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--card-border);font-size:13.5px;color:var(--text-primary);font-family:inherit;background:#fff;}
  .date-field{position:relative;}
  .date-field .cal{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .btn{padding:10px 20px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.cancel{background:#fff;border:1px solid var(--card-border);color:var(--text-primary);}
  .btn.save{background:var(--sidebar-active);border:none;color:#fff;}
</style>
</head>
<body>

<div class="modal">
  <h2>Edit Shipment — SHP-0051</h2>
  <div class="sub">BATCH1002 · Site 1 → Site 3</div>

  <div class="info-note">Editable only while Status = Dispatched. Once a shipment moves to In Transit, use "Update Status" instead.</div>

  <div class="row">
    <div class="field"><label>Batch ID<span class="req">*</span></label><input type="text" value="BATCH1002"></div>
    <div class="field"><label>Carrier<span class="req">*</span></label><input type="text" value="Blue Dart"></div>
  </div>

  <div class="row">
    <div class="field"><label>From Site ID<span class="req">*</span></label><input type="text" value="Site 1"></div>
    <div class="field"><label>To Site ID<span class="req">*</span></label><input type="text" value="Site 3"></div>
  </div>

  <div class="row">
    <div class="field">
      <label>Shipment Date<span class="req">*</span></label>
      <div class="date-field"><input type="text" value="27-07-2026"><span class="cal">📅</span></div>
    </div>
    <div class="field"><label>Quantity Shipped<span class="req">*</span></label><input type="text" value="1500"></div>
  </div>

  <div class="row" style="grid-template-columns:1fr;">
    <div class="field"><label>Unit<span class="req">*</span></label><input type="text" value="vials"></div>
  </div>

  <div class="modal-foot">
    <button class="btn cancel">Cancel</button>
    <button class="btn save">Save Changes</button>
  </div>
</div>

</body>
</html>
