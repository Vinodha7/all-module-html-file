<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaTrack — Sign In</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="login-bg">
  <form class="auth-card" onsubmit="return goDashboard(event)">
    <div class="auth-logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <h1>PharmaTrack</h1>
    <p class="tag">Sign in to continue</p>

    <div class="field">
      <label>Email</label>
      <input type="email" value="meera.nair@pharmatrack.com" required>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="pwd">
        <input id="pwd" type="password" value="Pharma@2026" required>
        <button type="button" class="eye" onclick="toggleEye(this)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn btn-primary" type="submit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign in
    </button>

    <div class="auth-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Protected environment. Access is logged and audited.
    </div>
  </form>
</div>

<script>
  function goDashboard(e){ e.preventDefault(); window.location.href = "dashboard.html"; return false; }
  function toggleEye(btn){ var i = document.getElementById('pwd'); i.type = i.type === 'password' ? 'text' : 'password'; }
</script>
</body>
</html>
