<!--
  SCREEN: Add Inventory modal (triggered by "+" on Inventory tab)
  Maps to: POST /pharmaTrack/supplyColdManagement/createInventory
  Recreated from live app screenshot for Figma import
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmaTrack — Add Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-active:#1a7a4f;
    --card-border:#e3e2dd;
    --text-primary:#1a1d1a;
    --text-secondary:#6b6b62;
    --text-muted:#9a998d;
    --radius-md:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:rgba(20,30,25,.35);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;width:600px;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.22);padding:28px 32px;}
  .modal h2{font-size:19px;font-weight:800;margin-bottom:22px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .req{color:#c0392b;}
  .field input{
    width:100%;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--card-border);
    font-size:13.5px;color:var(--text-primary);font-family:inherit;background:#fff;
  }
  .field input::placeholder{color:var(--text-muted);}
  .field .counter{font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .btn{padding:10px 20px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.cancel{background:#fff;border:1px solid var(--card-border);color:var(--text-primary);}
  .btn.save{background:var(--sidebar-active);border:none;color:#fff;}
</style>
</head>
<body>

<div class="modal">
  <h2>Add Inventory</h2>

  <div class="row">
    <div class="field">
      <label>Site ID<span class="req">*</span></label>
      <input type="text">
    </div>
    <div class="field">
      <label>Batch ID<span class="req">*</span></label>
      <input type="text">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Quantity Received<span class="req">*</span></label>
      <input type="text">
    </div>
    <div class="field">
      <label>Quantity Dispensed<span class="req">*</span></label>
      <input type="text" value="0">
    </div>
  </div>

  <div class="row" style="grid-template-columns:1fr;">
    <div class="field">
      <label>Storage Condition</label>
      <input type="text" placeholder="e.g. 2–8°C refrigerated">
      <div class="counter">0/60</div>
    </div>
  </div>

  <div class="modal-foot">
    <button class="btn cancel">Cancel</button>
    <button class="btn save">Save</button>
  </div>
</div>

</body>
</html>
