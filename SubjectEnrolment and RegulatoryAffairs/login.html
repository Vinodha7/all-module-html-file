<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — PharmaTrack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');
:root{
  --accent:#CE5200;--accent-dark:#562200;--accent-light:#fbe9de;--bg:#f7f5f2;--card:#ffffff;--border:#ece4dc;
  --text:#211611;--text-dim:#7a6a5e;--radius-lg:16px;--radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--accent);}
h1,.brand-name{font-family:'Manrope',sans-serif;}
.login-card{background:var(--card);width:100%;max-width:440px;margin:60px 20px;border-radius:var(--radius-lg);padding:44px 40px 36px;box-shadow:0 30px 70px rgba(30,16,8,.28);text-align:center;}
.logo{width:64px;height:64px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:var(--text);margin-bottom:4px;}
.brand-sub{color:var(--text-dim);font-size:14.5px;margin-bottom:32px;}
.field{text-align:left;margin-bottom:20px;}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:9px;color:var(--text);}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;background:#fff;color:var(--text);}
.field input::placeholder{color:#a89a8d;}
.password-wrap{position:relative;}
.password-wrap input{padding-right:44px;}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;justify-content:center;padding:4px;}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 24px;font-size:13.5px;}
.remember{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
.remember input{width:16px;height:16px;accent-color:var(--accent);}
.forgot-link{color:var(--accent-dark);font-weight:600;text-decoration:none;}
.forgot-link:hover{text-decoration:underline;}
.btn-signin{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;}
.btn-signin:hover{background:var(--accent-dark);}
.protected-note{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:22px;color:var(--text-dim);font-size:12.5px;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
    </div>
    <div class="brand-name">PharmaTrack</div>
    <div class="brand-sub">Sign in to continue</div>

    <form onsubmit="event.preventDefault(); window.location.href='subjects.html';">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="pharmaAdmin@pharmaTrack.com" value="pharmaAdmin@pharmaTrack.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" value="pharmatrack123" required>
          <button type="button" class="eye-btn" onclick="togglePwd()" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="row-between">
        <label class="remember"><input type="checkbox"> Remember me</label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn-signin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>

    <div class="protected-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Protected environment. Access is logged and audited
    </div>
  </div>
<script>
function togglePwd(){var f=document.getElementById('password');f.type=(f.type==='password')?'text':'password';}
</script>
</body>
</html>
